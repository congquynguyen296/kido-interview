<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your password was reset</title>
</head>
<body>
    <h2>Hello <span th:text="${name}">User</span>,</h2>
    <p>An administrator has reset your password.</p>
    <p>Your new password is: <strong><span th:text="${newPassword}">password</span></strong></p>
    <p>Please log in and change this password as soon as possible.</p>
</body>
</html>
