server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate.ddl-auto: validate
    show-sql: false
  data.redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:1025}
  security.oauth2.client.registration.google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    scope: [openid, profile, email]
    redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:auth-service}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    clock-skew: 30s
  cookie:
    refresh-token-name: refresh_token
    path: /api/v1/auth
    secure: true
    same-site: Strict
    http-only: true
    domain: ${COOKIE_DOMAIN}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowed-headers: ["*"]
    allow-credentials: true
    max-age: 1h
  oauth2:
    frontend-success-redirect-uri: ${FRONTEND_BASE_URL}/oauth2/callback
    frontend-failure-redirect-uri: ${FRONTEND_BASE_URL}/login?error=oauth2
  otp:
    length: 6
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 60s
    reset-token-ttl: 10m
    email-verification-ttl: 24h
  auth:
    max-failed-login-attempts: 5
    lock-duration: 15m
    failed-attempt-window: 15m
    bcrypt-strength: 10
    password-min-length: 8
    require-email-verification: true
    public-endpoints: [/api/v1/auth/**, /oauth2/**, /login/oauth2/**, /swagger-ui/**, /v3/api-docs/**, /actuator/health]
  admin-bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    full-name: System Administrator
  mail:
    from: no-reply@example.com
    from-name: Auth Service
    frontend-reset-password-url: ${FRONTEND_BASE_URL}/reset-password
    frontend-verify-email-url: ${FRONTEND_BASE_URL}/verify-email
  pagination:
    default-page-size: 10
    max-page-size: 100
  springdoc.enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
